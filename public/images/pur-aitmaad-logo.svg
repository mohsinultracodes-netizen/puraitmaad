<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <title>Pur Aitmaad Logo</title>
  <desc>Premium property management logo with geometric building and home symbol.</desc>

  <!-- Transparent background -->
  <g id="mark" fill="none" stroke="#C9A66B" stroke-width="34" stroke-linejoin="miter" stroke-linecap="square">
    <!-- Left outer building -->
    <path d="M350 650 V430 L470 315 V600" />
    <!-- Left inner tower -->
    <path d="M470 600 V360 L545 285 V650" />

    <!-- Central tower -->
    <path d="M585 650 V245 L615 215 L645 245 V650" />

    <!-- Right inner tower -->
    <path d="M685 650 V285 L760 360 V600" />
    <!-- Right outer building -->
    <path d="M760 315 L880 430 V650" />

    <!-- House / stewardship roof -->
    <path d="M430 655 L615 515 L800 655" />
  </g>

  <!-- Window -->
  <g fill="#C9A66B">
    <rect x="583" y="585" width="28" height="28"/>
    <rect x="619" y="585" width="28" height="28"/>
    <rect x="583" y="621" width="28" height="28"/>
    <rect x="619" y="621" width="28" height="28"/>
  </g>

  <!-- Brand name -->
  <text x="600" y="820"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="118"
        font-weight="800"
        letter-spacing="2"
        fill="#202020">PUR AITMAAD</text>

  <!-- Tagline -->
  <text x="600" y="900"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="34"
        font-weight="600"
        letter-spacing="12"
        fill="#202020">ALWAYS LOOKED AFTER</text>
</svg>
